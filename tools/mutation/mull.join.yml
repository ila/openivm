mutators:
  - cxx_arithmetic
  - cxx_comparison
  - cxx_boundary
  - cxx_logical

# Keep the POC deliberately small. The overnight campaign can broaden this to
# src/delta/operators/ or all OpenIVM-owned src/ files.
includePaths:
  - ".*/src/delta/operators/join\\.cpp$"

excludePaths:
  - ".*/duckdb/.*"
  - ".*/third_party/.*"

parallelization:
  workers: 4
  executionWorkers: 4
